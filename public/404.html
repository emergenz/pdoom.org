<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | p(doom)</title>
    <script src="/site-announcement.js"></script>
    <style>
      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        margin: 0;
        color: #0b1015;
        background: #f0ece3;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      main {
        width: 100%;
        flex: 1;
        display: grid;
        place-content: center;
        padding: 24px;
      }

      a { color: #b7361e; }

      .site-announcement {
        position: relative;
        width: 100%;
        min-height: 38px;
        color: #fff;
        background: #b7361e;
        border-bottom: 1px solid rgba(11, 16, 21, 0.28);
      }

      .site-announcement a {
        min-height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 7px 48px;
        color: inherit;
        font-size: 13px;
        line-height: 1.25;
        text-decoration: none;
      }

      .site-announcement strong {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .site-announcement button {
        position: absolute;
        top: 50%;
        right: 8px;
        width: 30px;
        height: 30px;
        display: inline-grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 3px;
        color: rgba(255, 255, 255, 0.78);
        background: transparent;
        font: inherit;
        font-size: 19px;
        cursor: pointer;
        transform: translateY(-50%);
      }

      .site-announcement a:hover,
      .site-announcement a:focus-visible {
        background: rgba(11, 16, 21, 0.1);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .site-announcement button:hover,
      .site-announcement button:focus-visible {
        color: #fff;
        background: rgba(11, 16, 21, 0.15);
      }

      .site-announcement :focus-visible {
        outline: 2px solid #fff;
        outline-offset: -3px;
      }

      html.paid-announcement-dismissed .site-announcement { display: none; }
    </style>
  </head>
  <body>
    <aside class="site-announcement" aria-label="Paid data collection">
      <a href="/careers/paid-data-collection"><span>We pay <strong>$300/month</strong> to record your screen for AI research</span></a>
      <button type="button" aria-label="Dismiss announcement" title="Dismiss announcement" data-dismiss-paid-announcement>×</button>
    </aside>
    <main>
      <h1>Page not found</h1>
      <p><a href="/">Return to p(doom)</a></p>
    </main>
    <script>
      (function () {
        if (location.pathname.replace(/\/+$/, '') === '/onboard') {
          location.replace('/onboard.html' + location.search + location.hash)
          return
        }

        var path = location.pathname.replace(/^\/+|\/+$/g, '')
        if (!path || path.indexOf('/') !== -1) return

        var slug = path.replace(/\.html?$/i, '').toLowerCase()
        var canonical = 'participate'
        if (slug.slice(0, 2) !== canonical.slice(0, 2)) return

        function editDistance(first, second) {
          var previous = []
          var current = []
          var firstIndex
          var secondIndex
          for (secondIndex = 0; secondIndex <= second.length; secondIndex += 1) previous[secondIndex] = secondIndex
          for (firstIndex = 1; firstIndex <= first.length; firstIndex += 1) {
            current[0] = firstIndex
            for (secondIndex = 1; secondIndex <= second.length; secondIndex += 1) {
              var substitution = first.charAt(firstIndex - 1) === second.charAt(secondIndex - 1) ? 0 : 1
              current[secondIndex] = Math.min(
                previous[secondIndex] + 1,
                current[secondIndex - 1] + 1,
                previous[secondIndex - 1] + substitution
              )
            }
            var swap = previous
            previous = current
            current = swap
          }
          return previous[second.length]
        }

        if (editDistance(slug, canonical) <= Math.max(3, Math.floor(canonical.length * 0.3))) {
          location.replace('/careers/paid-data-collection')
        }
      })()
    </script>
  </body>
</html>
