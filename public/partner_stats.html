<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07130e">
<title>Your referral stats · crowd-cast</title>
<link rel="icon" type="image/png" sizes="128x128" href="/favicon.png">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
  @font-face {
    font-family: "Instrument Sans";
    src: url("/fonts/instrument-sans.woff2") format("woff2");
    font-style: normal; font-weight: 400 700; font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("/fonts/ibm-plex-mono.woff2") format("woff2");
    font-style: normal; font-weight: 400 500; font-display: swap;
  }

  :root {
    color-scheme: light;
    --ink: #0b1015;
    --white: #f0ece3;
    --off-white: #e5e0d6;
    --signal: #b7361e;
    --steel-dark: #506777;
    --rule: rgba(11, 16, 21, 0.2);
    --muted: rgba(11, 16, 21, 0.62);
    --gutter: 40px;
  }
  @media (max-width: 900px) { :root { --gutter: 24px; } }
  @media (max-width: 620px) { :root { --gutter: 20px; } }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    background: var(--white);
    color: var(--ink);
    font-family: "Instrument Sans", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .prose a { border-bottom: 1px solid currentColor; }
  .prose a:hover { color: var(--signal); }

  .shell { width: min(calc(100% - (2 * var(--gutter))), 1600px); margin-inline: auto; }

  header.bar { padding: 26px 0; border-bottom: 1px solid var(--rule); }
  .wordmark { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
  .wordmark:hover { color: var(--signal); }

  main { padding: clamp(44px, 5vw, 76px) 0 clamp(70px, 8vw, 120px); }
  .layout { display: grid; grid-template-columns: 5fr 7fr; gap: clamp(28px, 5vw, 72px); align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; gap: 30px; } }

  .kicker { font-size: 14px; color: var(--steel-dark); margin: 0 0 18px; }
  h1 {
    margin: 0;
    font-size: clamp(42px, 5.2vw, 76px);
    font-weight: 500;
    line-height: 0.96;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .prose p { font-size: clamp(17px, 1.15vw, 19px); color: var(--ink); margin: 0 0 14px; max-width: 60ch; }
  .prose p.sub { color: var(--muted); }

  .via {
    display: none; margin-top: 22px; padding: 12px 0;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    font-size: 15px; color: var(--muted);
  }
  .via b { color: var(--ink); font-weight: 500; }

  form { margin-top: clamp(34px, 4vw, 54px); display: flex; flex-direction: column; gap: 30px; max-width: 720px; }
  .field label {
    display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px;
  }
  .field .hint { font-size: 14px; color: var(--muted); margin: 0 0 12px; max-width: 58ch; }
  input[type=text], input[type=email], textarea {
    width: 100%; padding: 12px 0; font-family: inherit; font-size: 17px; color: var(--ink);
    background: transparent; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0;
    transition: border-color 180ms ease;
  }
  input::placeholder, textarea::placeholder { color: rgba(11,16,21,0.34); }
  input:focus, textarea:focus { outline: none; border-bottom-color: var(--signal); }
  textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
  .count { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  button {
    justify-self: start; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 12px;
    font: inherit; font-size: 17px; font-weight: 500;
    color: var(--off-white); background: var(--ink);
    border: 0; border-radius: 0; padding: 17px 30px; cursor: pointer;
    transition: background 180ms ease;
  }
  button:hover:not(:disabled) { background: #23303b; }
  button:disabled { opacity: 0.5; cursor: default; }
  button svg { transition: transform 180ms ease; }
  button:hover:not(:disabled) svg { transform: translateX(4px); }

  .err {
    display: none; margin-top: 26px; padding: 13px 0;
    border-top: 1px solid var(--signal); border-bottom: 1px solid var(--signal);
    color: var(--signal); font-size: 15px;
  }
  .fine { margin-top: clamp(40px, 5vw, 64px); font-size: 14px; color: var(--muted); max-width: 62ch; }
  .fine a { border-bottom: 1px solid currentColor; }
  .fine a:hover { color: var(--signal); }

  .done { max-width: 640px; }
  .done h2 { font-size: clamp(30px, 3.4vw, 46px); font-weight: 500; line-height: 1.02; margin: 0 0 18px; letter-spacing: -0.01em; }
  .done p { font-size: clamp(17px, 1.15vw, 19px); color: var(--muted); margin: 0 0 12px; max-width: 56ch; }
  .done a { border-bottom: 1px solid currentColor; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin: clamp(30px, 4vw, 44px) 0 0; }
  .tile { background: var(--white); padding: 18px 20px; }
  .tile .k { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .tile .v { font-size: clamp(26px, 3vw, 34px); font-weight: 500; line-height: 1; letter-spacing: -0.01em; }
  .tile.pay .v { color: var(--signal); }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 15px; }
  th { text-align: left; font-size: 13px; font-weight: 500; color: var(--muted); padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule); }
  td { padding: 13px 12px 13px 0; border-bottom: 1px solid var(--rule); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .sect { margin-top: clamp(38px, 5vw, 60px); }
  .sect h2 { font-size: clamp(22px, 2.2vw, 30px); font-weight: 500; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sect p.note { color: var(--muted); font-size: 14.5px; margin: 0; max-width: 62ch; }
  .linkbox { margin-top: 26px; padding: 14px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .linkbox code { font-family: "IBM Plex Mono", monospace; font-size: 14.5px; word-break: break-all; }
</style>
</head>
<body>
<header class="bar"><div class="shell"><a class="wordmark" href="/">p(doom)</a></div></header>
<main class="shell">
  <div id="root">
    <p class="kicker">crowd-cast</p>
    <h1 id="title">Your referrals</h1>
    <div class="prose"><p class="sub" id="sub">Loading&hellip;</p></div>
    <div id="body"></div>
  </div>
</main>
<script>
(function () {
  var API = 'https://ob3iugfiy2.execute-api.us-east-1.amazonaws.com/v1/partner-stats';
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  var token = '';
  try { token = new URLSearchParams(window.location.search).get('token') || ''; } catch (e) {}
  var sub = document.getElementById('sub');
  var body = document.getElementById('body');

  if (!token) {
    sub.textContent = '';
    body.innerHTML = '<div class="err" style="display:block;">This page needs your personal stats link. Ask us to resend it.</div>';
    return;
  }

  fetch(API + '?token=' + encodeURIComponent(token))
    .then(function (r) {
      if (r.status === 404) throw new Error('That stats link is not valid any more. Ask us for a fresh one.');
      if (!r.ok) throw new Error('Could not load your stats (error ' + r.status + '). Please try again shortly.');
      return r.json();
    })
    .then(function (d) {
      var t = d.tranches || { trial: 150, hours: 150, hours_gate: 100 };
      sub.innerHTML = 'For <b>' + esc(d.name) + '</b>. Everyone who signs up through your link, and what you have earned.';

      var rows = (d.referrals || []).map(function (r, i) {
        return '<tr><td>' + (i + 1) + '</td><td>' + esc(r.applied || '&mdash;') + '</td><td>' + esc(r.stage) + '</td>' +
               '<td class="num">' + (r.earned_usd ? '$' + r.earned_usd : '&mdash;') + '</td>' +
               '<td class="num">' + (r.paid_usd ? '$' + r.paid_usd : '&mdash;') + '</td></tr>';
      }).join('');

      body.innerHTML =
        '<div class="tiles">' +
          '<div class="tile"><p class="k">Link clicks</p><div class="v">' + (d.clicks || 0) + '</div></div>' +
          '<div class="tile"><p class="k">Signed up</p><div class="v">' + (d.signups || 0) + '</div></div>' +
          '<div class="tile"><p class="k">Passed first week</p><div class="v">' + (d.passed_trial || 0) + '</div></div>' +
          '<div class="tile pay"><p class="k">Earned, unpaid</p><div class="v">$' + (d.owed_usd || 0) + '</div></div>' +
          '<div class="tile"><p class="k">Already paid</p><div class="v">$' + (d.paid_usd || 0) + '</div></div>' +
        '</div>' +
        ((d.owed_usd || 0) > 0
          ? '<div class="sect"><h2>You have $' + (d.owed_usd || 0) + ' to claim</h2>' +
            '<p class="note">Confirm a few details once and we pay it out.</p>' +
            '<p style="margin-top:14px;"><a href="/refer_claim.html?token=' + encodeURIComponent(token) + '" style="border-bottom:1px solid currentColor;font-weight:500;">Claim your premium &rarr;</a></p></div>'
          : ((d.claimed_usd || 0) > 0
            ? '<div class="sect"><h2>Claim submitted</h2><p class="note">$' + (d.claimed_usd || 0) + ' is confirmed and being paid out. We\'ll email you the payment record once it\'s sent.</p></div>'
            : '')) +
        '<div class="sect"><h2>Your link</h2>' +
          '<div class="linkbox"><code>' + esc(d.link) + '</code></div></div>' +
        '<div class="sect"><h2>Everyone you sent</h2>' +
          '<p class="note">One row per person who signed up through your link. Rows show no names or emails, though as the person who sent them you may recognise who is who. We only ever share whether the payout milestones were reached, never their recordings, application outcome, or anything else.</p>' +
          (rows
            ? '<table><thead><tr><th>#</th><th>Signed up</th><th>Where they are</th><th class="num">Earned</th><th class="num">Paid</th></tr></thead><tbody>' + rows + '</tbody></table>'
            : '<p class="note" style="margin-top:14px;">Nobody yet. Once someone signs up through your link they show up here.</p>') +
        '</div>' +
        '<p class="fine">You earn <strong>$' + t.trial + '</strong> when someone you referred passes their first week of recording, and <strong>$' + t.hours + '</strong> more once they reach ' + t.hours_gate + ' recorded hours. Everyone goes through the same review as any other applicant, so not everyone you send will be accepted. Reply to the email we sent you to arrange payment.</p>';
    })
    .catch(function (err) {
      sub.textContent = '';
      body.innerHTML = '<div class="err" style="display:block;">' + esc(err.message || err) + '</div>';
    });
})();
</script>
</body>
</html>
