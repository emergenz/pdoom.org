<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07130e">
<title>Your updated agreement · crowd-cast</title>
<link rel="icon" type="image/png" sizes="128x128" href="/favicon.png">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
  @font-face {
    font-family: "Instrument Sans";
    src: url("/fonts/instrument-sans.woff2") format("woff2");
    font-style: normal; font-weight: 400 700; font-display: swap;
  }
  @font-face {
    font-family: "IBM Plex Mono";
    src: url("/fonts/ibm-plex-mono.woff2") format("woff2");
    font-style: normal; font-weight: 400 500; font-display: swap;
  }

  :root {
    color-scheme: light;
    --ink: #0b1015;
    --white: #f0ece3;
    --off-white: #e5e0d6;
    --signal: #b7361e;
    --steel-dark: #506777;
    --rule: rgba(11, 16, 21, 0.2);
    --muted: rgba(11, 16, 21, 0.62);
    --gutter: 40px;
  }
  @media (max-width: 900px) { :root { --gutter: 24px; } }
  @media (max-width: 620px) { :root { --gutter: 20px; } }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    background: var(--white);
    color: var(--ink);
    font-family: "Instrument Sans", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .prose a { border-bottom: 1px solid currentColor; }
  .prose a:hover { color: var(--signal); }

  .shell { width: min(calc(100% - (2 * var(--gutter))), 1600px); margin-inline: auto; }

  header.bar { padding: 26px 0; border-bottom: 1px solid var(--rule); }
  .wordmark { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
  .wordmark:hover { color: var(--signal); }

  main { padding: clamp(44px, 5vw, 76px) 0 clamp(70px, 8vw, 120px); }
  .layout { display: grid; grid-template-columns: 5fr 7fr; gap: clamp(28px, 5vw, 72px); align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; gap: 30px; } }

  .kicker { font-size: 14px; color: var(--steel-dark); margin: 0 0 18px; }
  h1 {
    margin: 0;
    font-size: clamp(42px, 5.2vw, 76px);
    font-weight: 500;
    line-height: 0.96;
    letter-spacing: -0.015em;
    text-wrap: balance;
  }
  .prose p { font-size: clamp(17px, 1.15vw, 19px); color: var(--ink); margin: 0 0 14px; max-width: 60ch; }
  .prose p.sub { color: var(--muted); }

  .via {
    display: none; margin-top: 22px; padding: 12px 0;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    font-size: 15px; color: var(--muted);
  }
  .via b { color: var(--ink); font-weight: 500; }

  form { margin-top: clamp(34px, 4vw, 54px); display: flex; flex-direction: column; gap: 30px; max-width: 720px; }
  .field label {
    display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px;
  }
  .field .hint { font-size: 14px; color: var(--muted); margin: 0 0 12px; max-width: 58ch; }
  input[type=text], input[type=email], textarea {
    width: 100%; padding: 12px 0; font-family: inherit; font-size: 17px; color: var(--ink);
    background: transparent; border: 0; border-bottom: 1px solid var(--rule); border-radius: 0;
    transition: border-color 180ms ease;
  }
  input::placeholder, textarea::placeholder { color: rgba(11,16,21,0.34); }
  input:focus, textarea:focus { outline: none; border-bottom-color: var(--signal); }
  textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
  .count { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  button {
    justify-self: start; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 12px;
    font: inherit; font-size: 17px; font-weight: 500;
    color: var(--off-white); background: var(--ink);
    border: 0; border-radius: 0; padding: 17px 30px; cursor: pointer;
    transition: background 180ms ease;
  }
  button:hover:not(:disabled) { background: #23303b; }
  button:disabled { opacity: 0.5; cursor: default; }
  button svg { transition: transform 180ms ease; }
  button:hover:not(:disabled) svg { transform: translateX(4px); }

  .err {
    display: none; margin-top: 26px; padding: 13px 0;
    border-top: 1px solid var(--signal); border-bottom: 1px solid var(--signal);
    color: var(--signal); font-size: 15px;
  }
  .fine { margin-top: clamp(40px, 5vw, 64px); font-size: 14px; color: var(--muted); max-width: 62ch; }
  .fine a { border-bottom: 1px solid currentColor; }
  .fine a:hover { color: var(--signal); }

  .done { max-width: 640px; }
  .done h2 { font-size: clamp(30px, 3.4vw, 46px); font-weight: 500; line-height: 1.02; margin: 0 0 18px; letter-spacing: -0.01em; }
  .done p { font-size: clamp(17px, 1.15vw, 19px); color: var(--muted); margin: 0 0 12px; max-width: 56ch; }
  .done a { border-bottom: 1px solid currentColor; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar"><div class="shell"><a class="wordmark" href="/">p(doom)</a></div></header>
<main class="shell">
  <div id="root">
    <p class="kicker">crowd-cast</p>
    <h1 id="title">Your updated agreement</h1>
    <div class="prose"><p class="sub" id="sub">Loading&hellip;</p></div>
    <div class="err" id="err"></div>
    <form id="form" novalidate style="display:none;">
      <p class="prose" style="max-width:60ch;">Please review your updated Data Purchase Agreement (we emailed you the PDF), then accept below to switch to your new rate. Nothing changes until you accept.</p>
      <label class="check" style="display:flex;gap:12px;align-items:flex-start;font-size:15.5px;max-width:60ch;cursor:pointer;">
        <input type="checkbox" id="agree" style="margin-top:4px;flex:0 0 auto;accent-color:var(--signal);">
        <span>I have read and accept the updated Data Purchase Agreement.</span>
      </label>
      <button type="submit" id="submit">Accept updated agreement
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <div class="done" id="done" style="display:none;"><h2 id="done-title">All set.</h2><p id="done-msg"></p></div>
  </div>
</main>
<script>
(function () {
  var API = 'https://ob3iugfiy2.execute-api.us-east-1.amazonaws.com/v1';
  function esc(s) { return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var pid='', token='';
  try { var q=new URLSearchParams(window.location.search); pid=q.get('pid')||''; token=q.get('token')||''; } catch(e) {}
  var sub=document.getElementById('sub'), err=document.getElementById('err'), form=document.getElementById('form');
  function fail(m) { err.style.display='block'; err.textContent=m; }
  function showDone(t,m) { form.style.display='none'; document.getElementById('done').style.display=''; document.getElementById('done-title').textContent=t; document.getElementById('done-msg').textContent=m; }
  if (!pid || !token) { sub.textContent=''; fail('This page needs your personal link. Please use the link we emailed you.'); return; }
  fetch(API+'/reconsent?pid='+encodeURIComponent(pid)+'&token='+encodeURIComponent(token))
    .then(function(r) { if (r.status===404) throw new Error('This link is not valid any more. Ask us for a fresh one.'); if (!r.ok) throw new Error('Could not load your agreement. Please try again shortly.'); return r.json(); })
    .then(function(d) {
      if (d.already_accepted) { sub.textContent=''; showDone('Already accepted.', 'You are already on your updated rate. Nothing more to do.'); return; }
      var sym = d.currency==='EUR' ? '€' : '$';
      sub.innerHTML = 'Hi <b>'+esc((d.name||'there').split(' ')[0])+'</b> — your new monthly compensation is <b>'+sym+d.amount+'</b>.';
      form.style.display='';
    })
    .catch(function(e) { sub.textContent=''; fail(e.message||String(e)); });
  form.addEventListener('submit', function(ev) {
    ev.preventDefault(); err.style.display='none';
    if (!document.getElementById('agree').checked) return fail('Please tick the box to accept.');
    var btn=document.getElementById('submit'); btn.disabled=true;
    fetch(API+'/reconsent-accept', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pid:pid, token:token}) })
      .then(function(r) { return r.json().then(function(d) { return {ok:r.ok, d:d}; }); })
      .then(function(res) { btn.disabled=false; if (!res.ok) return fail(res.d.error||'Something went wrong.'); showDone('Accepted — thank you.', 'You are now on your updated rate. Your next payout will reflect it. We have your acceptance on record.'); })
      .catch(function() { btn.disabled=false; fail('Network error. Please try again.'); });
  });
})();
</script>
</body>
</html>
